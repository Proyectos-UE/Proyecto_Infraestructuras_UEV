services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trendwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta python scripts/preparar_config.py antes de iniciar Docker}
      POSTGRES_DB: trendwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendwatch"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg2://trendwatch:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@db:5432/trendwatch
      API_KEY: ${API_KEY:?Falta API_KEY}
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:-TrendWatch/0.1 (https://github.com/Proyectos-UE/Proyecto_Infraestructuras_UEV)}
      WIKI_PROJECT: ${WIKI_PROJECT:-es.wikipedia}
      SOURCE_MODE: ${SOURCE_MODE:-wikipedia}
      DEMO_SOURCE_URL: http://demo:8001/datos
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-86400}
      HISTORY_DAYS: ${HISTORY_DAYS:-90}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      demo: {condition: service_started}

  demo:
    build: .
    command: ["uvicorn", "trendwatch.demo_source:app", "--host", "0.0.0.0", "--port", "8001"]

  worker:
    build: .
    command: ["python", "-m", "trendwatch.worker"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      demo: {condition: service_started}

  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://api:8000
      SOURCE_MODE: ${SOURCE_MODE:-wikipedia}
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
